minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--exclude-files"
          - "\\.terraform\\.lock\\.hcl$"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: "\\.sh$"
        types: [shell]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-w", "-i", "2", "-ci", "-sr"]
        files: "\\.sh$"
        types: [shell]

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.22.1
        entry: markdownlint-cli2
        files: "^(README|CHANGELOG|CONTRIBUTING)\\.md$|^examples/.*\\.md$|^plugins/.*\\.md$"
        types: [markdown]

      - id: validate-codex-plugin
        name: validate Codex plugin manifest
        language: python
        entry: python scripts/validate_codex_plugin.py
        pass_filenames: false
        files: "(^|/)\\.codex-plugin/plugin\\.json$|^\\.agents/plugins/marketplace\\.json$|^scripts/validate_codex_plugin\\.py$"

      - id: validate-skill-frontmatter
        name: validate Agent Skill frontmatter
        language: python
        additional_dependencies: [pyyaml]
        entry: python scripts/validate_skill_frontmatter.py
        pass_filenames: false
        files: "(^|/)SKILL\\.md$|^scripts/validate_skill_frontmatter\\.py$"

      - id: validate-evals
        name: validate skill eval cases
        language: python
        additional_dependencies: [pyyaml]
        entry: python scripts/validate_evals.py
        pass_filenames: false
        files: "^plugins/[^/]+/evals/|(^|/)eval_queries\\.json$|^scripts/(validate_evals|eval_suite)\\.py$"

      - id: validate-versions
        name: validate release version fields agree
        language: python
        entry: python scripts/validate_versions.py
        pass_filenames: false
        files: "(^|/)(plugin|marketplace)\\.json$|^\\.release-please-manifest\\.json$|^release-please-config\\.json$|(^|/)(SKILL|README)\\.md$|^scripts/validate_versions\\.py$"

      - id: pytest
        name: pytest
        language: python
        additional_dependencies: [pytest, pyyaml]
        entry: python -m pytest tests -q
        pass_filenames: false
        always_run: true
