# A plan-and-apply pipeline for one Terraform stack on Azure, for GitHub Actions.
# It is a starting point to adapt, and it does nothing while it sits in this directory:
# GitHub runs workflows only from .github/workflows/.
#
# What it does
#   pull request   Static checks, the audit, and a plan with an identity that can only read. The job
#                  fails when the plan deletes or replaces a resource, unless the pull request carries
#                  the label `allow-destroy`. A person adds that label after reading the list.
#   push to main   The same plan, then an apply of that exact plan file. The apply waits for the
#                  reviewers that the `production` environment requires.
#
# Before you use it
#   1. Create two identities with federated credentials and no client secret: one for plans, one for
#      applies. Limit the plan identity's credential to pull requests and to `main`, and the apply
#      identity's credential to the `production` environment.
#   2. Give the plan identity Reader on the stack's scope, Storage Blob Data Contributor on the state
#      container (a plan takes the lock), and read access to any data plane the configuration reads.
#      Give the apply identity the write roles the stack needs, and nothing wider.
#   3. Set the repository variables AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_PLAN_CLIENT_ID and
#      AZURE_APPLY_CLIENT_ID. None of them is a secret.
#   4. Require reviewers on the `production` environment, and create the `allow-destroy` label.
#   5. Copy the skill's scripts/tf_audit.py and assets/azurerm-5-changes.json into the repository and
#      keep their layout, for example under tools/terraform-audit/. The script finds the data file at
#      ../assets/ from its own directory.
#   6. Check the action versions. Each is pinned to a commit; move the pins only to commits you have
#      reviewed.
#   7. Commit the stack's .terraform.lock.hcl. Without it the apply job can resolve other provider
#      versions than the plan job, and Terraform then refuses the plan file.
#
# What to know
#   - A plan runs the pull request's code with the plan identity: an `external` data source is a local
#     process. Keep that identity read-only, and require approval before workflows run for outside
#     contributors.
#   - A pull request from a fork gets no token for Azure, so its plan job fails. Review the change,
#     then push it to a branch in this repository.
#   - The allow-destroy label stays on the pull request, so it also covers later commits. Remove it
#     when the pull request changes, and add it again after reading the new list.
#   - Approve the apply within the plan file's retention, or raise the retention. After that the
#     apply job finds no plan and fails, which is safe. Re-run only the newest run on main: an
#     older run would plan an older commit.
#
# The plan file can hold secrets. Anyone who can read this repository's workflow artifacts can
# download it, so the retention is one day. Shorten it, or encrypt the file, if that is too open.
name: terraform

on:
  pull_request:
    # `labeled` and `unlabeled` make the workflow run again when the allow-destroy label changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "stacks/workload/**"
      - "modules/**"
  push:
    branches:
      - main
    paths:
      - "stacks/workload/**"
      - "modules/**"

permissions:
  contents: read

# Runs on main share one group, so applies never overlap: a queued run waits for the one before it,
# and a newer queued run replaces an older queued one, which is safe because each run plans the latest
# commit. Each pull request has its own group. The state lock and -lock-timeout cover the rest.
concurrency:
  group: terraform-workload-prod-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  STACK_DIR: stacks/workload
  ENVIRONMENT: prod
  TF_IN_AUTOMATION: "1"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # lets the job request the token that Azure exchanges for access
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
    defaults:
      run:
        shell: bash
        working-directory: stacks/workload

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Static checks
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Audit against the authoring standard
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/tools/terraform-audit/scripts/tf_audit.py" --fail-on major .
          python3 "${GITHUB_WORKSPACE}/tools/terraform-audit/scripts/tf_audit.py" --fail-on major "${GITHUB_WORKSPACE}/modules"

      - name: Plan
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="environments/${ENVIRONMENT}.backend.hcl"
          terraform plan -input=false -lock-timeout=5m -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan

      - name: List deletions and replacements
        env:
          ALLOW_DESTROY: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destroy') }}
        run: |
          set -euo pipefail
          plan_json="$(mktemp)"
          trap 'rm -f "${plan_json}"' EXIT
          terraform show -json tfplan > "${plan_json}"
          deletions="$(jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.address)\t\(.type)\t\(.change.actions | join("+"))"' "${plan_json}")"
          if [ -z "${deletions}" ]; then
            echo "The plan deletes and replaces nothing."
            exit 0
          fi
          {
            echo "### Resources this plan deletes or replaces"
            echo
            echo '```text'
            echo "${deletions}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "${deletions}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${ALLOW_DESTROY}" != "true" ]; then
            echo "::error::The plan deletes or replaces resources. Read the list, then add the allow-destroy label if each one is intended."
            exit 1
          fi

      - name: Keep the plan for the apply job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: stacks/workload/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Required reviewers approve here, after reading the plan job's output. What they approve is what runs:
    # the job applies the saved plan file and does not plan again. If the state has moved on since the
    # plan, Terraform refuses the file and the pipeline starts over.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
    defaults:
      run:
        shell: bash
        working-directory: stacks/workload

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Fetch the reviewed plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: stacks/workload

      - name: Apply the reviewed plan
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config="environments/${ENVIRONMENT}.backend.hcl"
          terraform apply -input=false -lock-timeout=5m tfplan
