name: skill-validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentskills-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Agent Skills reference validator
        # PyPI package `skills-ref` installs a CLI named `agentskills` (source: agentskills/agentskills).
        run: python -m pip install "skills-ref==0.1.1"

      - name: Validate every Agent Skill
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          skill_dirs=(plugins/*/skills/*/)
          if [ "${#skill_dirs[@]}" -eq 0 ]; then
            echo "::error::No Agent Skill directories found under plugins/*/skills/*/" >&2
            exit 1
          fi
          for skill_dir in "${skill_dirs[@]}"; do
            echo "Validating ${skill_dir}"
            agentskills validate "${skill_dir}"
          done

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate plugin manifests
        run: claude plugin validate .
